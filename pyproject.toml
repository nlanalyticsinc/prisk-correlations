[project]
name = "prisk-replication"
version = "0.1.0"
description = "Correlation checks for reproduced NLA PRisk, PSentiment, and PRiskT scores against original firm-quarter measures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
notebook = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "nbconvert>=7",
]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
